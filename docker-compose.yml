services:
  wyoming-supertonic:
    build:
      context: .
      args:
        SUPERTONIC_REF: main
        WITH_RU: "false"   # set to "true" to enable Russian auto-stress
    image: wyoming-supertonic:latest
    container_name: wyoming-supertonic
    restart: unless-stopped
    ports:
      - "10209:10209"
    # Optional Russian enhanced normalization; defaults remain legacy/en.
    # This example does not install or enable the external Silero accentor.
    # Supertonic's own model behavior is unaffected by stress mode "off".
    # environment:
    #   SUPERTONIC_NORMALIZATION_PROFILE: enhanced
    #   SUPERTONIC_STRESS_MODE: off
    #   SUPERTONIC_DICTIONARY_PATH: /config/supertonic-dictionary.yaml
    # Optional prosody hint (all languages/profiles; default 1 = unchanged):
    #   SUPERTONIC_QUESTION_MARKS: "3"
    volumes:
      # Persists the auto-downloaded model (~ a few hundred MB) so it
      # survives container rebuilds/restarts.
      - ./data:/data
      # Uncomment with the enhanced example environment above:
      # - ./supertonic-dictionary.yaml:/config/supertonic-dictionary.yaml:ro
    # Anything here is forwarded by docker_run.sh to `python -m wyoming_supertonic`
    command:
      - --language=en
      # - --default-voice=F2
      - --speed=1.0
      - --steps=5
      - --threads=4
      - --debug
